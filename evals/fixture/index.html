<!doctype html>
<html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>모래 작업함 — 가상 데이터</title><link rel="stylesheet" href="style.css">
<body><main><header><p>모래 · 가상 데이터</p><h1>작업함</h1></header>
<section aria-labelledby="results-heading"><h2 id="results-heading">작업 검색</h2><label for="search">제목 검색</label><input id="search" type="search"><p id="count" role="status"></p><ul id="results"></ul></section>
<section aria-labelledby="note-heading"><h2 id="note-heading">메모</h2><form id="note-form"><label for="note">메모 내용</label><input id="note" required><button type="submit">저장</button><p id="feedback" role="status"></p></form></section>
</main><script src="app.js"></script></body></html>
